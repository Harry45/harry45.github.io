<figure class="figure align{{ include.align }}"{% if include.align == "center" %} style="max-width: {{ include.width }}px"{% endif %}>
  {% if include.href %}<a href="{{ include.href }}">{% endif %}<img src="{{ include.url }}" alt="{{ include.alt | default: include.caption | strip_html | escape }}" loading="lazy">{% if include.href %}</a>{% endif %}
  {% if include.caption and include.caption != "" %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
