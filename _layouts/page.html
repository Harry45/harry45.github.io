---
layout: default
---
<div class="container container--prose">
  {% if page.title %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </header>
  {% endif %}

  <article class="prose">
    {{ content }}
  </article>
</div>
